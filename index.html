<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tindahan · PayMongo Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f7;--surface:#fff;--ink:#10263a;--muted:#5b6f80;--line:#d3e0e8;--accent:#0b6bcb;--accent-ink:#fff;--ok:#12805c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a26;--surface:#142636;--ink:#e8f1f7;--muted:#93a7b6;--line:#274055;--accent:#4a9bf0;--accent-ink:#06121c;--ok:#4cc99b}}
:root[data-theme="dark"]{--bg:#0c1a26;--surface:#142636;--ink:#e8f1f7;--muted:#93a7b6;--line:#274055;--accent:#4a9bf0;--accent-ink:#06121c;--ok:#4cc99b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;max-width:46ch}
.item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.item .ico{font-size:2rem;width:52px;height:52px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex:none}
.item .info{flex:1;min-width:0}
.item b{display:block}
.item span{color:var(--muted);font-size:.9rem}
.price{font-weight:800;white-space:nowrap}
button{font:inherit;cursor:pointer}
.buy{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.buy:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{margin-top:22px;font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);width:min(92vw,380px);padding:22px}
dialog::backdrop{background:rgba(5,15,25,.55)}
dialog h2{margin:0 0 2px;font-size:1.25rem}
.total{color:var(--muted);margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:600}
.opt:hover{border-color:var(--accent)}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:210px;margin:8px auto 10px;border:8px solid #fff;background:#fff}
.qr i{aspect-ratio:1;background:#fff}.qr i.on{background:#000}
.center{text-align:center}
.ok{color:var(--ok);font-weight:800;font-size:1.1rem}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;margin-top:6px}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style>
</head>
<body>
<main>
  <h1>Tindahan</h1>
  <p class="sub">Piliin ang bibilhin, pagkatapos bayaran gamit ang GCash, Maya, QR Ph, o card.</p>
  <div id="list"></div>
  <p class="note" id="mode"></p>
</main>

<dialog id="dlg">
  <div id="step1">
    <h2 id="pname"></h2>
    <p class="total" id="ptotal"></p>
    <button class="opt" data-m="gcash">GCash</button>
    <button class="opt" data-m="paymaya">Maya</button>
    <button class="opt" data-m="qrph">QR Ph</button>
    <button class="opt" data-m="card">Card (Visa / Mastercard)</button>
    <button class="link" id="cancel">Kanselahin</button>
  </div>
  <div id="step2" class="center" hidden>
    <h2>I-scan para magbayad</h2>
    <p class="total" id="qrtotal"></p>
    <div class="qr" id="qr" aria-label="Demo QR code"></div>
    <p class="total">Demo lang ito. Walang totoong bayad.</p>
    <button class="buy" id="paid">Nabayaran ko na</button>
  </div>
  <div id="step3" class="center" hidden>
    <p class="ok">Salamat! Natanggap ang bayad.</p>
    <p class="total">Sa totoong site, ang webhook ng PayMongo ang magko-confirm nito.</p>
    <button class="buy" id="done">Isara</button>
  </div>
</dialog>

<script>
// ====== SETTINGS ======
const DEMO = false;                 // false = gamitin ang totoong backend mo
const API_URL = "";                // hal. "https://site-mo.onrender.com"
// Sa LIVE mode: ire-redirect sa  API_URL + "/checkout/<id>"  (ang FastAPI route na ginawa natin)
// Huwag kailanman ilagay ang secret key dito. Sa server lang iyon.
const PRODUCTS = [
  {id:"1", icon:"📚", name:"Reviewer Pack", desc:"PDF, 120 pages", price:150},
  {id:"2", icon:"📱", name:"Android App Template", desc:"Sketchware project", price:299.5},
  {id:"3", icon:"🎨", name:"Logo Design", desc:"2 revisions", price:500}
];
const peso = n => "₱" + n.toLocaleString("en-PH",{minimumFractionDigits:2});
const $ = id => document.getElementById(id);
let current = null;

$("list").innerHTML = PRODUCTS.map(p => `
  <div class="item">
    <div class="ico" aria-hidden="true">${p.icon}</div>
    <div class="info"><b>${p.name}</b><span>${p.desc}</span></div>
    <div class="price">${peso(p.price)}</div>
    <button class="buy" data-id="${p.id}" aria-label="Bayaran ang ${p.name}">Bayaran</button>
  </div>`).join("");

$("mode").textContent = DEMO
  ? "Demo mode: simulation lang ito. Itakda ang DEMO = false at ang API_URL para ikonekta sa FastAPI backend mo."
  : "Live mode: ire-redirect ka sa PayMongo checkout.";

function show(n){ ["step1","step2","step3"].forEach((s,i)=> $(s).hidden = i !== n-1); }

$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if(!b) return;
  current = PRODUCTS.find(p => p.id === b.dataset.id);
  $("pname").textContent = current.name;
  $("ptotal").textContent = "Total: " + peso(current.price);
  show(1); $("dlg").showModal();
});

$("step1").addEventListener("click", e => {
  const o = e.target.closest(".opt"); if(!o) return;
  if(!DEMO){ location.href = `${API_URL}/checkout/${current.id}`; return; }
  $("qrtotal").textContent = current.name + " · " + peso(current.price);
  drawQR(); show(2);
});

function drawQR(){
  const N = 21; let seed = +current.id * 97 + 13, html = "";
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const finder = (r,c) => {
    const f = (r0,c0) => { const y=r-r0, x=c-c0; if(y<0||y>6||x<0||x>6) return null;
      return y===0||y===6||x===0||x===6||(y>=2&&y<=4&&x>=2&&x<=4); };
    for (const [a,b] of [[0,0],[0,N-7],[N-7,0]]){ const v=f(a,b); if(v!==null) return v; }
    return null;
  };
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const v = finder(r,c); html += `<i class="${(v===null ? rnd()>.5 : v) ? "on":""}"></i>`;
  }
  $("qr").innerHTML = html;
}

$("paid").onclick = () => show(3);
$("cancel").onclick = $("done").onclick = () => $("dlg").close();
</script>
</body>
</html>
